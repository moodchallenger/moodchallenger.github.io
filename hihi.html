<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Falling Maple Leaves</title>
  <style>
    body, html {
      margin: 0;
      overflow: hidden;
      background: #edf0ec;
    }
    canvas {
      display: block;
    }
    body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #f7faf8;
    font-family: 'Segoe UI', sans-serif;
  }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }

  .navbar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 15px 30px;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0, 0, 0, 0.4);
    z-index: 10;
    color: rgb(218, 214, 214);
    backdrop-filter: blur(6px);
     transition: transform 0.4s ease;
  }
  
  .navbar.hidden {
    transform: translateY(-100%);
  }

  .nav-logo {
    font-size: 1.5rem;
    font-weight: bold;
  }

  .nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
  }

  .nav-links li a {
    color: white;
    text-decoration: none;
    font-size: 1rem;
    transition: opacity 0.3s;
  }

  .nav-links li a:hover {
    opacity: 0.7;
  }
  .centered-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: rgb(11, 11, 11);
  z-index: 5;
  pointer-events: none;
}

.centered-text h1 {
  font-size: 3.5rem;
  margin: 0;
  text-shadow: 2px 4px 12px rgba(67, 66, 66, 0.6);
}

.centered-text p {
  font-size: 1.25rem;
  margin-top: 0.5rem;
  text-shadow: 1px 3px 10px rgba(0, 0, 0, 0.5);
}

  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">🍃 Moodchallenger</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <div class="centered-text">
  <h1>Welcome to NatureSite</h1>
  <p>Experience the beauty of falling leaves</p>
</div>

  <script type="module" src="main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>

<script>
  let lastScrollY = window.scrollY;
  const navbar = document.querySelector('.navbar');

  window.addEventListener('scroll', () => {
    const currentScrollY = window.scrollY;

    if (currentScrollY > lastScrollY && currentScrollY > 10) {
      navbar.classList.add('hidden');
    } else {
      navbar.classList.remove('hidden');
    }

    lastScrollY = currentScrollY;
  });
</script>

<script>
let scene, camera, renderer;
let instancedMesh;
const leafCount = 50000;
let leafTexture;

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60, window.innerWidth / window.innerHeight, 0.1, 1000
  );
  camera.position.z = 100;

  renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  new THREE.TextureLoader().load('images/mapple-leaf.png', (texture) => {
    leafTexture = texture;
    leafTexture.encoding = THREE.sRGBEncoding;
    leafTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    createLeaves();
    animate();
  });

  const light = new THREE.AmbientLight(0xffffff, 1);
  scene.add(light);

  window.addEventListener('resize', onWindowResize);
}

const dummy = new THREE.Object3D();
const velocities = [], rotSpeeds = [];

function createLeaves() {
  const geometry = new THREE.PlaneGeometry(10, 10);
  const material = new THREE.MeshBasicMaterial({
    map: leafTexture,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    alphaTest: 0.2,
    blending: THREE.NormalBlending,
  });

  instancedMesh = new THREE.InstancedMesh(geometry, material, leafCount);

  for (let i = 0; i < leafCount; i++) {
    dummy.position.set(
      (Math.random() - 0.5) * window.innerWidth,
      Math.random() * window.innerHeight,
      (Math.random() - 0.5) * 200
    );

    dummy.rotation.set(
      Math.random() * Math.PI,
      Math.random() * Math.PI,
      Math.random() * Math.PI
    );

    dummy.updateMatrix();
    instancedMesh.setMatrixAt(i, dummy.matrix);

    velocities.push(new THREE.Vector3(
      (Math.random() - 0.5) * 0.2,
      -0.3 - Math.random() * 0.2,
      (Math.random() - 0.5) * 0.2
    ));

    rotSpeeds.push(new THREE.Vector3(
      0.002 * (Math.random() - 0.5),
      0.002 * (Math.random() - 0.5),
      0.002 * (Math.random() - 0.5)
    ));
  }

  scene.add(instancedMesh);
}

function animate() {
    // Compute scale based on depth (Z distance)
let z = dummy.position.z;
let scaleFactor = THREE.MathUtils.clamp(1 - z / 400, 0.2, 3); // closer = larger

dummy.scale.set(scaleFactor, scaleFactor, scaleFactor);
  requestAnimationFrame(animate);
  const time = performance.now() * 0.001;

  for (let i = 0; i < leafCount; i++) {
    instancedMesh.getMatrixAt(i, dummy.matrix);
    dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);

    dummy.position.add(velocities[i]);
    dummy.rotation.x += rotSpeeds[i].x;
    dummy.rotation.y += rotSpeeds[i].y;
    dummy.rotation.z += rotSpeeds[i].z;
    dummy.position.x += Math.sin(time + dummy.position.z * 0.1) * 0.1;

    if (dummy.position.y < -window.innerHeight / 2) {
      dummy.position.y = window.innerHeight / 2 + Math.random() * 100;
      dummy.position.x = (Math.random() - 0.5) * window.innerWidth;
      dummy.position.z = (Math.random() - 0.5) * 200;
    }

    dummy.updateMatrix();
    instancedMesh.setMatrixAt(i, dummy.matrix);
  }

  instancedMesh.instanceMatrix.needsUpdate = true;
  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
</body>
</html>
