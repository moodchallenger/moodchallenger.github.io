<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Realistic Falling Maple Leaves</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f7faf8;
      font-family: 'Segoe UI', sans-serif;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 30px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      z-index: 10;
      color: rgb(218, 214, 214);
      backdrop-filter: blur(6px);
      transition: transform 0.4s ease;
    }

    .navbar.hidden {
      transform: translateY(-100%);
    }

    .nav-logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    .nav-links li a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
      transition: opacity 0.3s;
    }

    .nav-links li a:hover {
      opacity: 0.7;
    }

    .centered-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgb(11, 11, 11);
      z-index: 5;
      pointer-events: none;
    }

    .centered-text h1 {
      font-size: 3.5rem;
      margin: 0;
      text-shadow: 2px 4px 12px rgba(67, 66, 66, 0.6);
    }

    .centered-text p {
      font-size: 1.25rem;
      margin-top: 0.5rem;
      text-shadow: 1px 3px 10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">🍃 Moodchallenger</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <div class="centered-text">
    <h1>Welcome to NatureSite</h1>
    <p>Experience the beauty of falling leaves</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>

  <script>
    let scene, camera, renderer;
    const leaves = [];
    const leafCount = 5000;
    let leafTexture;

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 100;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      new THREE.TextureLoader().load('images/mapple-leaf.png', (texture) => {
        leafTexture = texture;
        leafTexture.encoding = THREE.sRGBEncoding;
        leafTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        createLeaves();
        animate();
      });

      scene.add(new THREE.AmbientLight(0xffffff, 1));
      window.addEventListener('resize', onWindowResize);
    }

    function createLeaves() {
      const geometry = new THREE.PlaneGeometry(10, 10, 4, 4);
      const material = new THREE.MeshBasicMaterial({
        map: leafTexture,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
        alphaTest: 0.2
      });

      for (let i = 0; i < leafCount; i++) {
        const leaf = new THREE.Mesh(geometry.clone(), material.clone());
        resetLeaf(leaf);
        scene.add(leaf);
        leaves.push(leaf);
      }
    }

    function resetLeaf(leaf) {
      leaf.position.set(
        (Math.random() - 0.5) * window.innerWidth,
        Math.random() * window.innerHeight,
        (Math.random() - 0.5) * 200
      );

      leaf.rotation.set(
        Math.random() * Math.PI,
        Math.random() * Math.PI,
        Math.random() * Math.PI
      );

      leaf.userData = {
        velocity: new THREE.Vector3(
          (Math.random() - 0.5) * 0.3,
          -0.5 - Math.random() * 0.4,
          (Math.random() - 0.5) * 0.3
        ),
        rotSpeed: new THREE.Vector3(
          0.002 * (Math.random() - 0.5),
          0.002 * (Math.random() - 0.5),
          0.002 * (Math.random() - 0.5)
        )
      };

      const distanceFactor = THREE.MathUtils.clamp(1 - leaf.position.z / 200, 0.2, 2.5);
      leaf.scale.set(distanceFactor, distanceFactor, distanceFactor);
    }

    function bendLeafGeometry(leaf, time) {
      const pos = leaf.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        const originalX = pos.getX(i);
        const bendZ = Math.sin(time + y + leaf.position.x * 0.01) * 0.5;
        const bendX = originalX + Math.sin(y * 3 + time * 3) * 0.1;
        pos.setZ(i, bendZ);
        pos.setX(i, bendX);
      }
      pos.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now() * 0.001;

      leaves.forEach(leaf => {
        leaf.position.add(leaf.userData.velocity);

        leaf.rotation.x += leaf.userData.rotSpeed.x;
        leaf.rotation.y += leaf.userData.rotSpeed.y;
        leaf.rotation.z += leaf.userData.rotSpeed.z;

        leaf.position.x += Math.sin(time + leaf.position.z * 0.05) * 0.1;

        bendLeafGeometry(leaf, time);

        if (leaf.position.y < -window.innerHeight / 2) {
          resetLeaf(leaf);
          leaf.position.y = window.innerHeight / 2 + Math.random() * 100;
        }

        const distanceFactor = THREE.MathUtils.clamp(1 - leaf.position.z / 200, 0.2, 2.5);
        leaf.scale.set(distanceFactor, distanceFactor, distanceFactor);
      });

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
  </script>
</body>
</html>
